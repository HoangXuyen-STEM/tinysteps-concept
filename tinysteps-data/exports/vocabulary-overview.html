    :root {
      --bg-primary: #0a0f1d;

      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(0, 242, 254, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --color-primary: #00f2fe;
      --color-secondary: #4facfe;
      --color-accent: #f59e0b;
      --gradient-school: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --gradient-daily: linear-gradient(135deg, #f59e0b 0%, #e11d48 100%);
      --gradient-card: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(79, 172, 254, 0.06) 0%, transparent 45%);
      color: var(--text-main);
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: var(--transition);
    }

    .back-btn:hover {
      transform: translateX(-5px);
      color: #fff;
    }

    /* Header */
    header {
      margin-bottom: 3.5rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 800px;
    }

    /* Tab Controls */
    .tab-container {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      padding: 0.5rem;
      border-radius: 20px;
      margin-bottom: 3rem;
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.75rem 1.75rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn:hover {
      color: #fff;
    }

    .tab-btn.active {
      background: var(--gradient-school);
      color: #0a0f1d;
      box-shadow: 0 5px 15px rgba(0, 242, 254, 0.25);
    }

    /* Sections */
    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 0.75rem;
    }

    .section-title span {
      background: var(--gradient-school);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .vocab-section {
      margin-bottom: 4rem;
    }

    /* Grid layout for Vocabulary Cards */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .vocab-card {
      background: var(--gradient-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .vocab-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .vocab-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    .vocab-word {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .vocab-pos {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-primary);
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 6px;
    }

    .vocab-ipa {
      color: var(--color-accent);
      font-family: 'Plus Jakarta Sans', monospace;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .vocab-def {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .vocab-hint {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--glass-border);
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .vocab-hint strong {
      color: var(--text-main);
    }

    /* Grammar Section */
    .grammar-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    .grammar-card {
      background: var(--gradient-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      transition: var(--transition);
    }

    .grammar-card:hover {
      border-color: rgba(79, 172, 254, 0.3);
    }

    .grammar-id {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(79, 172, 254, 0.1);
      border: 1px solid rgba(79, 172, 254, 0.2);
      color: var(--color-secondary);
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .grammar-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .grammar-pattern {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      font-family: 'Plus Jakarta Sans', monospace;
      color: var(--color-primary);
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .grammar-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grammar-examples {
      list-style: none;
      margin-bottom: 1.5rem;
    }

    .grammar-examples li {
      position: relative;
      padding-left: 1.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .grammar-examples li::before {
      content: '➔';
      position: absolute;
      left: 0;
      color: var(--color-primary);
    }

    .grammar-examples span.context {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-left: 0.5rem;
    }

    .mistake-box {
      background: rgba(225, 29, 72, 0.05);
      border: 1px solid rgba(225, 29, 72, 0.2);
      border-radius: 16px;
      padding: 1.25rem;
    }

    .mistake-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .mistake-item:last-child {
      margin-bottom: 0;
    }

    .mistake-tag {
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      font-size: 0.75rem;
      text-align: center;
      min-width: 60px;
    }

    .mistake-tag.wrong {
      background: rgba(225, 29, 72, 0.15);
      color: #f43f5e;
      border: 1px solid rgba(225, 29, 72, 0.2);
    }

    .mistake-tag.correct {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .mistake-val {
      color: #cbd5e1;
      font-weight: 500;
    }

    .mistake-val.corrected {
      color: #fff;
    }

    /* Print styling */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .back-btn, .tab-container {
        display: none !important;
      }
      .vocab-card, .grammar-card {
        background: #fff !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        page-break-inside: avoid;
        box-shadow: none !important;
      }
      .vocab-word, .grammar-title {
        color: #000 !important;
      }
      .grammar-pattern {
        background: #f1f5f9 !important;
        color: #0f172a !important;
        border: 1px solid #ccc !important;
      }
      .mistake-box {
        background: #fff5f5 !important;
        border: 1px solid #feb2b2 !important;
      }
      .mistake-val, .mistake-val.corrected {
        color: #000 !important;
      }
      h1, .section-title {
        color: #000 !important;
        border-color: #000 !important;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .tab-container {
        flex-direction: column;
        gap: 0.5rem;
      }
      h1 {
        font-size: 2.2rem;
      }
      .container {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

    function switchLevel(level, btnElement) {
      // Toggle button active state
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // Load vocabulary
      const vocabContainer = document.getElementById('vocab-container');
      vocabContainer.innerHTML = '';
      if(vocabularyData[level]) {
        vocabularyData[level].forEach(item => {
          vocabContainer.innerHTML += `
            <div class="vocab-card" id="card-${item.id}">
              <div class="vocab-header">
                <span class="vocab-word">${item.word}</span>
                <span class="vocab-pos">${item.pos}</span>
              </div>
              <div class="vocab-ipa">${item.ipa}</div>
              <div class="vocab-def"><strong>Ví dụ:</strong> "${item.example_sentence}"</div>
              <div class="vocab-hint">
                <strong>Gợi ý hình ảnh:</strong> ${item.image_hint}
              </div>
            </div>
          `;
        });
      }

      // Load grammar
      const grammarContainer = document.getElementById('grammar-container');
      grammarContainer.innerHTML = '';
      if(grammarData[level]) {
        grammarData[level].forEach(point => {
          let examplesHtml = '';
          point.examples.forEach(ex => {
            examplesHtml += `<li>"${ex.sentence}" <span class="context">(${ex.context})</span></li>`;
          });

          let mistakesHtml = '';
          point.common_mistakes.forEach(mis => {
            mistakesHtml += `
              <div class="mistake-item">
                <span class="mistake-tag wrong">Sai</span>
                <span class="mistake-val">${mis.wrong}</span>
              </div>
              <div class="mistake-item">
                <span class="mistake-tag correct">Đúng</span>
                <span class="mistake-val corrected">${mis.correct}</span>
              </div>
            `;
          });

          grammarContainer.innerHTML += `
            <div class="grammar-card" id="card-${point.id}">
              <span class="grammar-id">${point.id}</span>
              <h3 class="grammar-title">${point.title}</h3>
              <div class="grammar-pattern">${point.pattern}</div>
              
              <div class="grammar-subtitle">💡 Ví dụ thực tế:</div>
              <ul class="grammar-examples">
                ${examplesHtml}
              </ul>

              <div class="mistake-box">
                <div class="grammar-subtitle" style="color: #f43f5e; margin-bottom: 0.75rem;">⚠️ Lỗi thường gặp của GV Việt Nam:</div>
                ${mistakesHtml}
              </div>
            </div>
          `;
        });
      }
    }

    // Default load Starters
    document.addEventListener("DOMContentLoaded", function() {
      switchLevel('starters', document.getElementById('default-tab'));
    });
  </script>
