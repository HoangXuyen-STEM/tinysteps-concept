<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Progression Map - TinySteps</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: rgba(20, 26, 46, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(0, 242, 254, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --color-primary: #00f2fe;
      --color-secondary: #4facfe;
      --color-accent: #f59e0b;
      --gradient-school: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --gradient-daily: linear-gradient(135deg, #f59e0b 0%, #e11d48 100%);
      --gradient-card: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 45%);
      color: var(--text-main);
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: var(--transition);
    }

    .back-btn:hover {
      transform: translateX(-5px);
      color: #fff;
    }

    /* Header */
    header {
      margin-bottom: 3.5rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #fff, #fed7aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 800px;
    }

    /* Master Layout */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
    }

    /* Topic List Sidebar */
    .sidebar {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 1.5rem;
      height: fit-content;
      backdrop-filter: blur(10px);
    }

    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding-left: 0.5rem;
    }

    .topic-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .topic-item {
      width: 100%;
    }

    .topic-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      text-align: left;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .topic-btn:hover {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
    }

    .topic-btn.active {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.2);
      color: var(--color-accent);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.05);
    }

    .group-divider {
      height: 1px;
      background: var(--glass-border);
      margin: 1.5rem 0;
    }

    /* Spiral Timeline Content */
    .content-panel {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .topic-meta {
      background: var(--gradient-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2rem;
      backdrop-filter: blur(12px);
    }

    .topic-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .topic-badge.school {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: var(--color-primary);
    }

    .topic-badge.daily {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--color-accent);
    }

    .topic-display-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .topic-display-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Vertical Timeline */
    .timeline {
      position: relative;
      padding-left: 2.5rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 1rem;
      bottom: 2rem;
      width: 2px;
      background: linear-gradient(to bottom, var(--color-primary) 0%, var(--color-accent) 100%);
      opacity: 0.3;
    }

    .timeline-node {
      position: relative;
      margin-bottom: 3rem;
    }

    .timeline-node:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -2.5rem;
      top: 0.25rem;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 3px solid var(--color-primary);
      z-index: 2;
      transition: var(--transition);
    }

    .timeline-node:nth-child(2) .timeline-dot { border-color: #4facfe; }
    .timeline-node:nth-child(3) .timeline-dot { border-color: #a5b4fc; }
    .timeline-node:nth-child(4) .timeline-dot { border-color: #f59e0b; }
    .timeline-node:nth-child(5) .timeline-dot { border-color: #e11d48; }

    .timeline-node:hover .timeline-dot {
      transform: scale(1.3);
      box-shadow: 0 0 12px var(--color-primary);
    }

    .timeline-card {
      background: var(--gradient-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.75rem;
      backdrop-filter: blur(10px);
      transition: var(--transition);
    }

    .timeline-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateX(4px);
    }

    .timeline-level-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
    }

    .timeline-focus {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .timeline-cando {
      font-size: 0.95rem;
      color: var(--color-primary);
      font-weight: 500;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .timeline-cando::before {
      content: '🎯';
    }

    .timeline-examples-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .timeline-examples {
      list-style: none;
    }

    .timeline-examples li {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      padding-left: 1.25rem;
      position: relative;
    }

    .timeline-examples li::before {
      content: '✔';
      position: absolute;
      left: 0;
      color: var(--color-accent);
      font-size: 0.8rem;
    }

    /* Print styling */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .back-btn, .sidebar {
        display: none !important;
      }
      .layout {
        grid-template-columns: 1fr !important;
      }
      .timeline-card {
        background: #fff !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        page-break-inside: avoid;
        box-shadow: none !important;
      }
      .timeline-focus, .topic-display-name {
        color: #000 !important;
      }
      .timeline::before {
        background: #000 !important;
      }
      h1, .timeline-dot {
        border-color: #000 !important;
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        width: 100%;
      }
      .topic-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }
      .group-divider {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .topic-list {
        grid-template-columns: repeat(2, 1fr);
      }
      h1 {
        font-size: 2.2rem;
      }
      .container {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <header>
      <h1>Spiral Progression Map</h1>
      <p>Sơ đồ tiến trình phát triển xoắn ốc (Spiral Progression). Chọn một chủ đề từ cột bên trái để theo dõi cách kiến thức và năng lực ngôn ngữ mở rộng qua 5 cấp độ CEFR.</p>

    <div class="layout">

          <button class="topic-btn" onclick="switchTopic('topic_checking_understanding', this)">🧐 Understanding</button>
          <button class="topic-btn" onclick="switchTopic('topic_praise_correction', this)">⭐ Praise & Correction</button>
          <button class="topic-btn" onclick="switchTopic('topic_school_communication', this)">💬 School Comm</button>
        </div>

        <div class="group-divider"></div>

        <div class="sidebar-title">Daily Life</div>
        <div class="topic-list">
          <button class="topic-btn" onclick="switchTopic('topic_market', this)">🛒 At the market</button>
          <button class="topic-btn" onclick="switchTopic('topic_restaurant', this)">🍽️ Restaurant</button>
          <button class="topic-btn" onclick="switchTopic('topic_travel', this)">✈️ Travel & Map</button>
          <button class="topic-btn" onclick="switchTopic('topic_phone', this)">📞 Phone call</button>

      </div>

      <!-- Main spiral visualization -->
      <div class="content-panel">
        <div class="topic-meta" id="topic-meta-panel">
          <!-- Rendered via JS -->

        <div class="timeline" id="timeline-panel">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>
  </div>

        spiral: [
          { level: "Starters", focus: "Basic conversational exchanges", cando: "Can greet someone, ask how they are, and say goodbye", examples: ["Hello! How are you?", "I'm fine, thank you.", "Goodbye!"] },
          { level: "Movers", focus: "Small talk about yesterday and the weather", cando: "Can talk about the weather and yesterday's simple actions", examples: ["The weather is very nice today.", "Yesterday I walked to school."] },
          { level: "Flyers", focus: "Chatting about personal hobbies", cando: "Can discuss simple hobbies and introduce interests", examples: ["Gardening is my favorite hobby.", "I'm going to share my hobby."] },
          { level: "KET", focus: "Polite advice and relative statements in small talk", cando: "Can suggest social activities and introduce friends with details", examples: ["I suggest we meet on Friday.", "What is your opinion on this?"] },
          { level: "PET", focus: "Discussing hypothetical options and complex hobbies", cando: "Can hold active, polite debates about opinions and social themes", examples: ["Furthermore, the discussion was very useful.", "If I had time, I would try a new hobby."] }
        ]
      }
    };

    function switchTopic(topicId, btnElement) {
      // Toggle button active state
      document.querySelectorAll('.topic-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const data = topicsData[topicId];
      if(!data) return;

      // Meta Panel
      const metaPanel = document.getElementById('topic-meta-panel');
      metaPanel.innerHTML = `
        <span class="topic-badge ${data.group}">${data.group === 'school' ? '🏫 School & Teaching' : '🛒 Daily Life'}</span>
        <h2 class="topic-display-name">${data.name}</h2>
        <p class="topic-display-desc">${data.description}</p>
      `;

      // Timeline Panel
      const timelinePanel = document.getElementById('timeline-panel');
      timelinePanel.innerHTML = '';
      
      data.spiral.forEach((levelNode, index) => {
        let examplesHtml = '';
        levelNode.examples.forEach(ex => {
          examplesHtml += `<li>"${ex}"</li>`;
        });

        timelinePanel.innerHTML += `
          <div class="timeline-node">
            <div class="timeline-dot"></div>
            <div class="timeline-card">
              <span class="timeline-level-badge">Level: ${levelNode.level}</span>
              <h3 class="timeline-focus">${levelNode.focus}</h3>
              <div class="timeline-cando">${levelNode.cando}</div>
              
              <div class="timeline-examples-title">💡 Ví dụ thực tiễn:</div>
              <ul class="timeline-examples">
                ${examplesHtml}
              </ul>
            </div>
          </div>
        `;
      });
    }

    // Default load first topic
    document.addEventListener("DOMContentLoaded", function() {
      switchTopic('topic_before_class', document.querySelector('.topic-btn'));
    });
  </script>
</body>
</html>
